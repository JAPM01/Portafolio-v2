name: Deploy to GitHub Pages

on:
  push:
    branches: ["preview"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate single-source brand colors
        run: npm run test:colors
      - name: Demonstrate RED failure and GREEN recovery
        run: npm run test:colors:red
      - name: Verify CSS and WebGL palette propagation in Chromium
        run: npm run test:colors:propagation
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Portafolio-v2
      - name: Rewrite asset paths in CSS
        run: node scripts/rewrite-pages-paths.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /Portafolio-v2
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: preview
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
